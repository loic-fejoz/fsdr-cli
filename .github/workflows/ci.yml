on: [push, pull_request]

name: CI

jobs:
  lints:
    name: Lints
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@v3

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libzmq3-dev libasound2-dev libsoapysdr-dev

      - name: Run cargo fmt (FutureSDR)
        run: cargo fmt --all -- --check

      - name: Run cargo clippy (main)
        run: cargo clippy --all-targets --workspace --all-features -- -D warnings

  test-linux:
    name: Unit Tests Linux
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@nightly
      - run: sudo apt-get update && sudo apt-get install -y libzmq3-dev libasound2-dev liblttng-ust-dev libsoapysdr-dev
      - run: cargo test --all-targets --workspace --all-features

  test-macos:
    name: Unit Tests macOS
    runs-on: macos-latest
    env:
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo test --all-targets --workspace

  test-windows:
    name: Unit Test Windows
    runs-on: windows-latest
    env:
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo test --all-targets --workspace

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@nightly
      - run: sudo apt-get update && sudo apt-get install -y libzmq3-dev libasound2-dev liblttng-ust-dev libsoapysdr-dev
      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin
      - name: Run cargo tarpaulin
        run: cargo tarpaulin --workspace --all-targets --all-features --out Lcov
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
